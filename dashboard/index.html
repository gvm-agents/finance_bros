<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Model Dashboard</title>
<style>
:root{color-scheme:light;--bg:#f7f7f5;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--ink3:#73726c;--line:#e4e3de;--grid:#ecebe6;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--tint:#eef3fb;--good:#0a7d4f;--warn:#a86500;--bad:#c23a39}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#121211;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#9c9b91;--line:#333330;--grid:#2a2a28;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--tint:#20293a;--good:#3fbf8a;--warn:#e0a53a;--bad:#e66767}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#9c9b91;--line:#333330;--grid:#2a2a28;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--tint:#20293a;--good:#3fbf8a;--warn:#e0a53a;--bad:#e66767}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:650}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink2);font-size:14px}
nav a.on{background:var(--tint);color:var(--ink);font-weight:600}
.spacer{flex:1}
.pill{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--ink2)}
button,select,input{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ink3)}
button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ctx{display:flex;flex-wrap:wrap;gap:4px 18px;padding:6px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.ctx b{color:var(--ink);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
h2{font-size:21px;margin:4px 0 2px;line-height:1.25}
.sub{color:var(--ink2);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;position:relative}
.card h3{margin:0 0 2px;font-size:15px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chartbar{position:absolute;top:10px;right:12px;display:flex;gap:4px}
.chartbar button{font-size:12px;padding:2px 7px}
svg{display:block;width:100%;height:auto;max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.grid2 .card{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:13px;color:var(--ink2);margin:6px 0}
.legend button{border:0;background:none;padding:0;display:inline-flex;gap:6px;align-items:center;color:inherit}
.legend button.off{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:82px 1fr;gap:10px}
.list time{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.list a{text-decoration:none}
.list a:hover{text-decoration:underline}
.meta{font-size:12.5px;color:var(--ink3);margin-top:1px}
.kw{border-bottom:2px solid var(--c);font-weight:550}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--tint);font-weight:600}
th:first-child,td:first-child{text-align:left}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
#c-radar svg{max-width:620px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .n{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .l{font-size:12.5px;color:var(--ink2)}
.bar{height:10px;background:var(--grid);border-radius:5px;overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--s1);border-radius:5px;transition:width .4s}
.goal{padding:6px 0 6px calc(var(--d)*22px);border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.goal .t{flex:1;min-width:240px}
.st{font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.st.done{color:var(--good);border-color:var(--good)}.st.running{color:var(--warn);border-color:var(--warn)}.st.stopped{color:var(--bad);border-color:var(--bad)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12.5px;z-index:9;max-width:300px;display:none;white-space:pre-line}
.reading{max-width:760px}.reading p{white-space:pre-wrap;line-height:1.6}
.seg{display:inline-flex;flex-wrap:wrap;gap:0}
.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}.seg button:last-child{border-radius:0 6px 6px 0}
input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:280px}
.hit{cursor:pointer}
.err{color:var(--bad)}
@media (max-width:640px){.list li{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.chartbar{position:static;margin-bottom:6px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Open Model Dashboard</h1>
    <nav id="nav"></nav>
    <span class="spacer"></span>
    <span class="pill" id="mode">loading</span>
    <button id="theme" title="Switch light or dark">Theme</button>
  </div>
  <div class="ctx" id="ctx"></div>
</header>
<main id="main"></main>
<div class="tip" id="tip"></div>
<script>
"use strict";
const $=s=>document.querySelector(s), api=async(p,o)=>{const r=await fetch(p,o);return r.json()};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PAGES=[["sweep","Global Sweep"],["source","By Source"],["radar","Data Center Radar"],["compare","Compare"],["frontier","Frontier"],["status","Platform"],["goals","Goals"]];
const TOPIC_COLOR={"AI models":"var(--s1)","Big tech":"var(--s2)","Data centers":"var(--s3)","Robotics":"var(--s4)"};
const GROUP={"frontier":["Frontier","var(--s1)"],"open-cloud":["Open, hosted","var(--s2)"],"open-local":["Open, local","var(--s3)"],"open-cloud-tuned":["Trained, rented GPU","var(--s4)"],"system":["Our router","var(--ink)"]};
const NICE={muse_glimmer_tuned_fw:"Trained Muse Glimmer",gemma4_e2b_mini:"Gemma E2B, Mini",fw_auto:"Fireworks auto router",gptoss120_fw:"gpt-oss",gptoss120_fw_med:"gpt-oss, medium",deepseek41_fw:"DeepSeek",deepseek41_fw_off:"DeepSeek, thinking off",gemma4_12b_local:"Gemma 12B, laptop",gpt56luna:"luna",gpt56luna_none:"luna, thinking off",sonnet5:"Sonnet"};
const fmt={usd:x=>x>=1?"$"+x.toFixed(2):"$"+x.toFixed(3),pct:x=>x.toFixed(1)+"%",num:x=>Math.round(x).toLocaleString()};
let S={news:null,cmp:null,timer:null,stamp:0,hiddenTopics:new Set(),tables:{}};
const tip=$("#tip");
function showTip(e,t){tip.textContent=t;tip.style.display="block";const x=Math.min(e.clientX+14,innerWidth-310);tip.style.left=x+"px";tip.style.top=(e.clientY+14)+"px"}
function hideTip(){tip.style.display="none"}
document.addEventListener("mouseover",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t)showTip(e,t.dataset.tip)});
document.addEventListener("mousemove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t)showTip(e,t.dataset.tip);else hideTip()});

function route(){const h=(location.hash||"#/sweep").slice(2),[path,q]=h.split("?"),[page,...rest]=path.split("/");return{page:page||"sweep",arg:rest.map(decodeURIComponent).join("/"),q:new URLSearchParams(q||"")}}
function card(id,title,sub,body){return `<div class="card" id="${id}"><div class="chartbar"><button data-png="${id}" title="Save this chart as a picture">PNG</button><button data-table="${id}" title="Show the numbers">Table</button></div><h3>${esc(title)}</h3>${sub?`<div class="meta">${esc(sub)}</div>`:""}${body}<div class="tablebox" hidden></div></div>`}

/* ---- charts: plain SVG, one axis, thin marks ---- */
function ticks(max,n=4){if(max<=0)return[0,1];const s=Math.pow(10,Math.floor(Math.log10(max/n))),m=max/n/s,st=(m<=1?1:m<=2?2:m<=5?5:10)*s,o=[];for(let v=0;;v+=st){o.push(Math.round(v*1e6)/1e6);if(v>=max)break}return o}
function lineChart(o){ // o: labels[], series[{name,color,values,muted}], onPick, height
  const W=o.width||1040,H=o.height||300,L=40,R=o.direct?110:14,T=10,B=26,iw=W-L-R,ih=H-T-B,n=o.labels.length;
  const max=Math.max(1,...o.series.flatMap(s=>s.values)),tk=ticks(max),ymax=tk[tk.length-1];
  const x=i=>L+(n<2?0:i*iw/(n-1)),y=v=>T+ih-v/ymax*ih;let g="";
  for(const t of tk)g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--ink3)">${t}</text>`;
  const every=Math.ceil(n/(W<500?5:9));o.labels.forEach((l,i)=>{if(i%every==0)g+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--ink3)">${esc(l)}</text>`});
  for(const s of o.series)g+=`<polyline fill="none" stroke="${s.color}" stroke-width="${s.muted?1.5:2}" stroke-linejoin="round" stroke-linecap="round" points="${s.values.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`;
  if(o.direct){let last=1e9;for(const s of o.series.filter(q=>!q.muted).map(q=>({q,yy:y(q.values[n-1])})).sort((a,b)=>b.yy-a.yy)){const yy=Math.min(s.yy+4,last-14);last=yy;g+=`<text x="${W-R+6}" y="${yy}" font-size="12" fill="var(--ink2)">${esc(s.q.name)}</text>`}}
  const wbar=iw/Math.max(n-1,1);
  o.labels.forEach((l,i)=>{const t=l+"\n"+o.series.map(s=>s.name+": "+s.values[i]).join("\n");g+=`<rect class="hit" data-tip="${esc(t)}" ${o.pick?`data-hour="${i}"`:""} x="${x(i)-wbar/2}" y="${T}" width="${wbar}" height="${ih}" fill="transparent"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"chart")}">${g}</svg>`}
function legend(items,clickable){return `<div class="legend">${items.map(i=>clickable?`<button data-topic="${esc(i.name)}" class="${i.off?"off":""}"><span class="dot" style="background:${i.color}"></span>${esc(i.name)}</button>`:`<span style="display:inline-flex;gap:6px;align-items:center"><span class="dot" style="background:${i.color}"></span>${esc(i.name)}</span>`).join("")}</div>`}
function hbars(rows,val,show,o={}){ // rows sorted, thin rounded bars
  const W=520,LB=170,R=64,rh=24,max=Math.max(...rows.map(val),1e-9),H=rows.length*rh+6;let g="";
  rows.forEach((r,i)=>{const v=val(r),w=Math.max(2,v/max*(W-LB-R)),y=i*rh+4,c=(GROUP[r.group]||["","var(--ink3)"])[1],txt=r.name.length>26?r.name.slice(0,25)+"…":r.name;
    g+=`<g class="hit" data-tip="${esc(r.name+"\n"+show(v))}"><rect x="0" y="${y-3}" width="${W}" height="${rh}" fill="transparent"/><text x="${LB-8}" y="${y+12}" text-anchor="end" font-size="12" fill="var(--ink2)">${esc(txt)}</text><rect x="${LB}" y="${y+4}" width="${w}" height="9" rx="4" fill="${c}"/><text x="${LB+w+6}" y="${y+13}" font-size="12" fill="var(--ink)">${esc(show(v))}</text></g>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}
function bestSystem(k){return[...S.cmp.systems].filter(s=>s.per_hour>=2000&&!s.name.startsWith("gpt-oss")&&s.when!="all").sort((a,b)=>b[k]-a[k]||a.usd_per_1000-b.usd_per_1000||b.per_hour-a.per_hour)[0]}
function scatter(pts,yKey,yLabel){const bestName=(bestSystem(yKey)||{}).name;
  const W=1040,H=440,L=56,R=20,T=14,B=44,iw=W-L-R,ih=H-T-B,FLOOR=.01;
  const cx=p=>Math.max(p.usd_per_1000,FLOOR),xs=pts.map(cx),lo=Math.log10(FLOOR)-.1,hi=Math.log10(Math.max(...xs))+.25;
  const ys=pts.map(p=>p[yKey]),y0=Math.floor(Math.min(...ys)-2),y1=Math.min(100,Math.ceil(Math.max(...ys)+1));
  const X=v=>L+(Math.log10(v)-lo)/(hi-lo)*iw,Y=v=>T+ih-(v-y0)/(y1-y0)*ih;let g="";
  for(let t=Math.ceil(y0/2)*2;t<=y1;t+=2)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--ink3)">${t}</text>`;
  for(const t of [.01,.03,.1,.3,1,3,10])if(Math.log10(t)<hi)g+=`<text x="${X(t)}" y="${H-24}" text-anchor="middle" font-size="11" fill="var(--ink3)">${t==.01?"free":"$"+t}</text>`;
  g+=`<text x="${L+iw/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--ink2)">Cost per 1,000 items (log scale; free models shown at the left edge)</text><text transform="translate(13,${T+ih/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="var(--ink2)">${esc(yLabel)}</text>`;
  const f=frontier(pts.filter(p=>p.kind=="single"&&p.group!="open-local"),yKey,cx);g+=`<polyline fill="none" stroke="var(--ink3)" stroke-width="2" stroke-dasharray="5 4" points="${f.map(p=>X(cx(p))+","+Y(p[yKey])).join(" ")}"/>`;
  const on=new Set(f.map(p=>p.name)),placed=[];
  for(const p of pts){const sys=p.group=="system",c=(GROUP[p.group]||["","var(--ink3)"])[1],px=X(cx(p)),py=Y(p[yKey]),t=`${p.name}\n${yLabel}: ${p[yKey]}\nCost: ${fmt.usd(p.usd_per_1000)} per 1,000\nCaught ${p.caught} of ${p.real}; ${p.false_alarms} false alarms\nMedian ${p.median_seconds}s${p.note?"\n"+p.note:""}`;
    g+=`<g class="hit" data-tip="${esc(t)}"><circle cx="${px}" cy="${py}" r="14" fill="transparent"/>`+(sys?`<rect x="${px-5}" y="${py-5}" width="10" height="10" transform="rotate(45 ${px} ${py})" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`:`<circle cx="${px}" cy="${py}" r="5.5" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`)+`</g>`;
    if(on.has(p.name)||["sonnet5","fw_auto","muse_glimmer_tuned_fw"].includes(p.name)||p.name==bestName){const lab=short(p.name),ly=placed.reduce((a,q)=>Math.abs(q[0]-px)<170&&Math.abs(q[1]-a)<15?a+15:a,py-10);placed.push([px,ly]);const sys2=p.group=="system",end=px>W-190;g+=`<text x="${sys2?px:end?px-9:px+9}" y="${sys2?py-11:ly}" text-anchor="${sys2?"middle":end?"end":"start"}" font-size="12" fill="var(--ink)">${esc(lab)}</text>`}}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Quality against cost">${g}</svg>`}
const short=n=>{n=NICE[n]||n;const m=n.match(/^(.*?): second reads (.*)$/);if(!m)return n;return m[1]+(m[2].startsWith("every")?" (all)":" (warning words)")};
function frontier(pts,k,cx){const s=[...pts].sort((a,b)=>cx(a)-cx(b)||b[k]-a[k]),o=[];let best=-1;for(const p of s)if(p[k]>best){o.push(p);best=p[k]}return o}

/* ---- pages ---- */
function hourLabel(ts){const d=new Date(ts*1000);return d.toLocaleTimeString([], {hour:"numeric"})}
function binned(rows,now,hours=24){const start=Math.floor(now/3600)*3600-(hours-1)*3600,lab=[];for(let i=0;i<hours;i++)lab.push(hourLabel(start+i*3600));const idx=r=>Math.floor((r.ts-start)/3600);return{start,lab,idx,hours}}
function win(rows,now,h=24){const s=Math.floor(now/3600)*3600-(h-1)*3600;return rows.filter(r=>r.ts>=s&&r.ts<=now+3600)}
function highlight(title,r){const tk=S.news.topics;let out=esc(title);const pairs=[];for(const t of r.topics||[])for(const w of tk[t]||[])pairs.push([w,t]);pairs.sort((a,b)=>b[0].length-a[0].length);const done=new Set();for(const [w,t] of pairs){if(!w||done.has(w))continue;done.add(w);const rx=new RegExp("\\b("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")\\b","i");if(rx.test(out)){out=out.replace(rx,`<span class="kw" style="--c:${TOPIC_COLOR[t]}">$1</span>`);break}}return out}
function listHtml(rows,n=80){const v=[...rows].sort((a,b)=>b.ts-a.ts).slice(0,n);if(!v.length)return`<p class="meta">Nothing in this view yet.</p>`;return`<ul class="list">${v.map(r=>`<li><time>${new Date(r.ts*1000).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</time><div><a href="#/read/${encodeURIComponent(r.id)}">${highlight(r.title,r)}</a><div class="meta">${esc(r.source)}${(r.topics||[]).length?" · "+esc(r.topics.join(", ")):""}</div></div></li>`).join("")}</ul>`}
function setTable(id,head,rows){S.tables[id]=`<table><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`}

function pageSweep(r){
  const {rows,now}=S.news,w=win(rows,now),b=binned(w,now),topics=Object.keys(S.news.topics);
  const all=Array(24).fill(0),per=Object.fromEntries(topics.map(t=>[t,Array(24).fill(0)]));
  for(const x of w){const i=b.idx(x);if(i<0||i>23)continue;all[i]++;for(const t of x.topics)if(per[t])per[t][i]++}
  const hid=S.hiddenTopics,series=[{name:"All headlines",color:"var(--ink3)",values:all,muted:true},...topics.filter(t=>!hid.has(t)).map(t=>({name:t,color:TOPIC_COLOR[t],values:per[t]}))];
  const hour=r.q.get("hour"),topic=r.q.get("topic");let sel=w;if(hour!==null)sel=sel.filter(x=>b.idx(x)==+hour);if(topic)sel=sel.filter(x=>x.topics.includes(topic));
  const busiest=topics.map(t=>[t,per[t].reduce((a,c)=>a+c,0)]).sort((a,c)=>c[1]-a[1])[0],srcs=new Set(w.map(x=>x.source)).size;
  setTable("c-sweep",["Hour","All",...topics],b.lab.map((l,i)=>[l,all[i],...topics.map(t=>per[t][i])]));
  return `<h2>${fmt.num(w.length)} headlines from ${srcs} sources in the last 24 hours</h2><p class="sub">Busiest topic: ${esc(busiest?busiest[0]:"none")} (${busiest?busiest[1]:0}). Click an hour to see its headlines.</p>
  ${card("c-sweep","Global sweep","Headlines per hour, by topic",legend([{name:"All headlines",color:"var(--ink3)"}].concat(topics.map(t=>({name:t,color:TOPIC_COLOR[t],off:hid.has(t)}))),true)+lineChart({labels:b.lab,series,pick:true,direct:true,title:"Headlines per hour"}))}
  <div class="tools"><a href="#/source"><button>By Source</button></a>${hour!==null?`<a href="#/sweep"><button>Clear hour ${esc(b.lab[+hour]||"")}</button></a>`:""}</div>
  <div class="card"><h3>Latest headlines${topic?": "+esc(topic):""}</h3>${listHtml(sel)}</div>`}

function pageSource(r){
  const {rows,now}=S.news,w=win(rows,now),b=binned(w,now),groups={};
  for(const x of w)(groups[x.group]=groups[x.group]||[]).push(x);
  const gl=Object.entries(groups).sort((a,c)=>c[1].length-a[1].length),pick=r.q.get("group");
  const cards=gl.slice(0,12).map(([g,xs],k)=>{const v=Array(24).fill(0);for(const x of xs){const i=b.idx(x);if(i>=0&&i<24)v[i]++}return `<div class="card"><h3><a href="#/source?group=${encodeURIComponent(g)}">${esc(g)}</a></h3><div class="meta">${xs.length} headlines</div>${lineChart({labels:b.lab,series:[{name:g,color:"var(--s1)",values:v}],width:520,height:170})}</div>`}).join("");
  const srcs={};for(const x of w)if(!pick||x.group==pick)srcs[x.source]=(srcs[x.source]||0)+1;
  const top=Object.entries(srcs).sort((a,c)=>c[1]-a[1]);setTable("c-src",["Source","Headlines"],top);
  return `<h2>Where the news is coming from</h2><p class="sub">${gl.length} kinds of source, last 24 hours. Use your browser's Back button to return to the sweep.</p><div class="grid2" style="margin-bottom:16px">${cards}</div>
  ${pick?`<div class="card"><h3>${esc(pick)}</h3>${listHtml(w.filter(x=>x.group==pick),60)}</div>`:""}
  <div class="card"><h3>Sources${pick?": "+esc(pick):""}</h3>${S.tables["c-src"]}</div>`}

function pageRadar(r){
  const {rows}=S.news,cats=S.news.radar,dc=rows.filter(x=>(x.topics||[]).includes("Data centers")),pick=r.q.get("cat");
  const counts=cats.map(c=>({name:c,group:"open-cloud",n:dc.filter(x=>x.radar.includes(c)).length})).sort((a,c)=>c.n-a.n);
  setTable("c-radar",["Category","Headlines"],counts.map(c=>[c.name,c.n]));
  const links=counts.map(c=>`<a href="#/radar?cat=${encodeURIComponent(c.name)}"><button class="${pick==c.name?"on":""}">${esc(c.name)} (${c.n})</button></a>`).join(" ");
  const sel=pick?dc.filter(x=>x.radar.includes(pick)):dc;
  return `<h2>${fmt.num(dc.length)} data center headlines in this data</h2><p class="sub">Sorted by keyword rules, so a headline can fall in more than one group or in none. A wider lookback needs no real-time feed.</p>
  ${card("c-radar","What is moving","Headlines by category",hbars(counts,c=>c.n,v=>String(v)))}<div class="tools">${links}${pick?`<a href="#/radar"><button>Show all</button></a>`:""}</div><div class="card"><h3>${esc(pick||"All data center headlines")}</h3>${listHtml(sel,60)}</div>`}

function allPoints(){const c=S.cmp;return[...c.singles.map(s=>({...s,name:s.name})),...c.systems]}
function pageCompare(){
  const c=S.cmp,base=c.singles.find(s=>s.name=="sonnet5"),best=bestSystem("recall");
  const rows=[...c.singles.map(s=>({...s,name:NICE[s.name]||s.name})),...(best?[{...best,name:short(best.name)}]:[])].slice(0,8);
  const M=[["Recall","recall",fmt.pct,1],["Precision","precision",fmt.pct,1],["F1","f1",fmt.pct,1],["Accuracy","accuracy",fmt.pct,1],["Cost per 1,000","usd_per_1000",fmt.usd,0],["Median seconds","median_seconds",x=>x.toFixed(2)+"s",0],["Items an hour","per_hour",fmt.num,1]];
  setTable("c-cmp",["Model","Recall","Precision","F1","Accuracy","Cost per 1,000","Median s","Missed","False alarms"],rows.map(r=>[r.name,r.recall,r.precision,r.f1,r.accuracy,r.usd_per_1000,r.median_seconds,r.missed,r.false_alarms]));
  return `<h2>Each model on each measure</h2><p class="sub">${esc(c.set_label)}; ${c.real} are truly high priority. Recall is the share of those caught. Differences of 1 to 3 filings are not significant.</p>${legend(Object.values(GROUP).map(g=>({name:g[0],color:g[1]})))}
  <div class="grid2" style="margin-bottom:16px">${M.map(([t,k,f,hi])=>`<div class="card"><h3>${t}</h3><div class="meta">${hi?"Higher is better":"Lower is better"}</div>${hbars([...rows].sort((a,b)=>hi?b[k]-a[k]:a[k]-b[k]),r=>r[k],f)}</div>`).join("")}</div>
  <div class="card"><h3>All the numbers</h3>${S.tables["c-cmp"]}</div>`}

function pageFrontier(r){
  const y=r.q.get("y")||"recall",set=S.cmpSet,names={recall:"Recall",accuracy:"Accuracy",f1:"F1",precision:"Precision"},pts=allPoints(),c=S.cmp,base=c.singles.find(s=>s.name=="sonnet5");
  const f=bestSystem(y);
  const head=base&&f?`${short(f.name)}: ${names[y].toLowerCase()} ${f[y]}% against ${base[y]}% for Sonnet alone, at ${fmt.usd(f.usd_per_1000)} against ${fmt.usd(base.usd_per_1000)} per 1,000`:"Quality against cost",diff=base&&f?Math.abs(f.caught-base.caught):0;
  setTable("c-front",["Name","Group",names[y],"Cost per 1,000","Items an hour"],pts.map(p=>[short(p.name),(GROUP[p.group]||[p.group])[0],p[y],p.usd_per_1000,p.per_hour]));
  return `<h2>${esc(head)}</h2><p class="sub">Up and to the left is better. The dashed line is the best any single hosted model can do at each price. Diamonds above it are the frontier we made by routing.${diff<=3?` Quality gap: ${diff} filing${diff==1?"":"s"}, not significant on this set; the cost gap is the result.`:""}</p>
  <div class="tools">${Object.entries(names).map(([k,v])=>`<a href="#/frontier?y=${k}&set=${set}"><button class="${k==y?"on":""}">${v}</button></a>`).join("")}<span style="width:14px"></span>${[["fresh","181 fresh filings"],["earlier","Earlier 200"]].map(([k,v])=>`<a href="#/frontier?y=${y}&set=${k}"><button class="${k==set?"on":""}">${v}</button></a>`).join("")}</div>
  ${card("c-front","Quality against cost",`${c.n_items} scored 8-K filings, ${c.real} truly high priority. Saved answers. Trained model cost is one rented GPU run, an estimate.`,legend(Object.values(GROUP).map(g=>({name:g[0],color:g[1]})))+scatter(pts,y,names[y]))}
  ${policyCard()}`}

function policyCard(){const p=S.cmp.policies,cur=S.policy;return `<div class="card"><h3>Compliance setting: what a rule costs</h3><div class="meta">Best design each setting allows on saved answers, among those that keep up with ${fmt.num((p[0]||{}).need_per_hour||0)} items an hour when any can. Choosing one also changes the running router.</div>
  <div class="tools seg">${p.map(x=>`<button data-policy="${x.policy}" class="${cur==x.policy?"on":""}">${esc(x.label)}</button>`).join("")}</div>
  <table><tr><th>Setting</th><th>Recall</th><th>Missed</th><th>Cost per 1,000</th><th>Items an hour</th><th>Keeps up?</th></tr>${p.map(x=>`<tr><td>${esc(x.label)}: ${esc(short(x.best))}</td><td>${x.recall}%</td><td>${x.missed}</td><td>${fmt.usd(x.usd_per_1000)}</td><td>${fmt.num(x.per_hour)}</td><td>${x.keeps_up?"Yes":"No"}</td></tr>`).join("")}</table></div>`}

function pageStatus(){
  const s=S.status||{},T=[["Done",`${s.pct_done??0}%`],["Cost so far",fmt.usd(s.cost_so_far||0)],["Cost to finish",fmt.usd(s.cost_to_finish||0)],["Total estimate",fmt.usd(s.cost_total_est||0)],["Budget",fmt.usd(s.max_usd||0)],["Refusals, retried",s.refused||0],["Failed",s.failed||0],["Answers checked",s.checked||0],["Sent to a person",s.to_person||0],["Second reads",s.second_reads||0],["Second-read queue",s.second_queue??"-"],["Deferred",s.deferred||0],["Audited",s.audited||0],["Audit agreed",s.audited?Math.round(100*s.audit_agree/s.audited)+"%":"-"],["Items a second",s.items_per_sec||0]];
  return `<h2>${s.state=="no run yet"?"No run started yet":`${fmt.num(s.done||0)} of ${fmt.num(s.total||0)} items, ${esc(s.state||"")}`}</h2><p class="sub">${s.stopped?"Stopped: "+esc(s.stopped):"Deferred items keep their first answer; none are lost."}</p><div class="bar"><i style="width:${s.pct_done||0}%"></i></div>
  <div class="tiles">${T.map(([l,n])=>`<div class="tile"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>${S.cmp?policyCard():""}`}

function pageGoals(){const G=(S.goals||{goals:[]}).goals,show=(p,d)=>G.filter(g=>(g.parent||null)==p).map(g=>`<div class="goal" style="--d:${d}"><span class="st ${g.status}">${esc(g.status)}</span><span class="t">${esc(g.title)}${g.run?` <span class="meta">run ${esc(g.run)}</span>`:""}</span><select data-goal="${g.id}">${["planned","running","done","stopped"].map(s=>`<option ${s==g.status?"selected":""}>${s}</option>`).join("")}</select></div>`+show(g.id,d+1)).join("");
  const main=G.find(g=>!g.parent),open=G.filter(g=>g.status!="done"&&g.parent).length;
  return `<h2>${esc(main?main.title:"No goal set yet")}</h2><p class="sub">${open} sub-goals open of ${Math.max(G.length-1,0)}. Each follow-up question goes under the goal it came from.</p>
  <div class="card">${show(null,0)||'<p class="meta">Add the main goal below.</p>'}</div>
  <div class="card"><h3>Add a goal</h3><div class="tools"><input type="text" id="gt" placeholder="What are we trying to find out?"><select id="gp"><option value="">Top level</option>${G.map(g=>`<option value="${g.id}">Under ${g.id}: ${esc(g.title.slice(0,40))}</option>`).join("")}</select><button id="ga">Add</button></div></div>`}

async function pageRead(r){const m=$("#main");m.innerHTML=`<p class="meta">Loading the source…</p>`;const a=await api("/api/article?id="+encodeURIComponent(r.arg));if(a.error){m.innerHTML=`<p class="err">That headline was not found.</p>`;return}
  const x=a.row,safe=/^https?:\/\//i.test(x.link||"");
  m.innerHTML=`<div class="reading"><div class="tools"><button onclick="history.back()">Back</button></div><h2>${esc(x.title)}</h2><p class="sub">${esc(x.source)} · ${esc(x.group)} · ${esc(new Date(x.ts*1000).toLocaleString())}${safe?` · <a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">Open the source</a>`:""}</p><div class="card"><div class="meta">${a.full?"Text taken from the source page; layout is not preserved.":"Summary from the feed. The full page could not be fetched."}</div><p>${esc(a.text)}</p></div></div>`}

const RENDER={sweep:pageSweep,source:pageSource,radar:pageRadar,compare:pageCompare,frontier:pageFrontier,status:pageStatus,goals:pageGoals};
async function refresh(full){
  const r=route();full=full||S.failed;
  try{
    const c=await api("/api/context");paintContext(c);
    if(["sweep","source","radar"].includes(r.page)&&(full||!S.news||Date.now()-S.stamp>15000)){S.news=await api("/api/headlines");S.stamp=Date.now();full=true}
    const want=r.q.get("set")||"fresh";if(["compare","frontier","status"].includes(r.page)&&(!S.cmp||full||S.cmpSet!=want)){S.cmp=await api("/api/compare?set="+want);S.cmpSet=want}
    if(["frontier","status"].includes(r.page)){S.status=await api("/api/status");const lab=(S.status.context||{}).policy,m=((S.cmp||{}).policies||[]).find(p=>p.label==lab);S.policy=S.status.requested_policy||(m&&m.policy)||S.policy}
    if(r.page=="status")full=true;
    if(r.page=="goals"&&full)S.goals=await api("/api/goals");
    if(r.page=="read"){if(full){await ensureNews();pageRead(r)}return}
    if(full)$("#main").innerHTML=(RENDER[r.page]||pageSweep)(r);
  S.failed=false}catch(e){S.failed=true;console.error(e);if(e instanceof TypeError&&/fetch/i.test(e.message))$("#main").innerHTML=`<p class="err">The dashboard process is not answering. Check its Terminal window.</p>`;else $("#main").innerHTML=`<p class="err">This page could not be drawn: ${esc(e.message)}</p>`}
}
async function ensureNews(){if(!S.news)S.news=await api("/api/headlines")}
function paintContext(c){const x=c.context||{},pairs=[["Model",(x.models||[]).map(m=>NICE[m]||m).join(" + ")||"none running"],["Settings",Object.entries(x.settings||{}).map(([k,v])=>k+" "+v).join(", ")||"default"],["Task",x.task||"-"],["Measures",(x.measures||[]).join(", ")||"-"],["Policy",x.policy||"-"],["Workers",x.workers||"-"],["Host",x.host||"-"],["Run",c.run||"-"],["Time",c.now]];
  $("#ctx").innerHTML=pairs.map(([k,v])=>`<span>${k}: <b>${esc(v)}</b></span>`).join("");$("#mode").textContent=c.mode+(c.state?" · "+c.state:"")}
function paintNav(){const p=route().page;$("#nav").innerHTML=PAGES.map(([k,v])=>`<a href="#/${k}" class="${p==k?"on":""}">${v}</a>`).join("")}

/* ---- save a chart as a picture: colors resolved so the file looks right anywhere ---- */
function savePng(id){const c=document.getElementById(id),svg=c&&c.querySelector("svg");if(!svg)return;const cs=getComputedStyle(document.documentElement),res=s=>s&&s.includes("var(")?s.replace(/var\((--[\w-]+)\)/g,(m,v)=>cs.getPropertyValue(v).trim()):s;
  const clone=svg.cloneNode(true);clone.setAttribute("xmlns","http://www.w3.org/2000/svg");clone.querySelectorAll("*").forEach(n=>{for(const a of ["fill","stroke"])if(n.hasAttribute(a))n.setAttribute(a,res(n.getAttribute(a)));n.removeAttribute("data-tip")});
  clone.querySelectorAll("text").forEach(t=>t.setAttribute("font-family","Helvetica,Arial,sans-serif"));
  const vb=svg.viewBox.baseVal,k=2,cv=document.createElement("canvas");cv.width=vb.width*k;cv.height=vb.height*k+60;const g=cv.getContext("2d"),img=new Image();
  img.onload=()=>{g.fillStyle=cs.getPropertyValue("--surface").trim();g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,vb.width*k,vb.height*k);g.fillStyle=cs.getPropertyValue("--ink2").trim();g.font="22px Helvetica,Arial,sans-serif";g.fillText($("#ctx").innerText.replace(/\s+/g," ").slice(0,120),10,vb.height*k+38);
    cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=id.replace("c-","chart-")+"-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},"image/png")};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(clone))}

document.addEventListener("click",async e=>{const t=e.target,b=t.closest("button,[data-hour]");if(!b)return;
  if(b.dataset.png)return savePng(b.dataset.png);
  if(b.dataset.table){const box=document.getElementById(b.dataset.table).querySelector(".tablebox");box.innerHTML=S.tables[b.dataset.table]||"";box.hidden=!box.hidden;return}
  if(b.dataset.hour!==undefined){location.hash="#/sweep?hour="+b.dataset.hour;return}
  if(b.dataset.topic){const n=b.dataset.topic;if(n=="All headlines")return;S.hiddenTopics.has(n)?S.hiddenTopics.delete(n):S.hiddenTopics.add(n);refresh(true);return}
  if(b.dataset.policy){await api("/api/policy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({policy:b.dataset.policy})});S.policy=b.dataset.policy;refresh(true);return}
  if(b.id=="ga"){const title=$("#gt").value.trim();if(!title)return;await api("/api/goals",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,parent:$("#gp").value||null})});refresh(true)}
  if(b.id=="theme"){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;d.dataset.theme=dark?"light":"dark";try{localStorage.setItem("theme",d.dataset.theme)}catch(_){}refresh(true)}
});
document.addEventListener("change",async e=>{const g=e.target.dataset&&e.target.dataset.goal;if(g){await api("/api/goal",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:g,status:e.target.value})});refresh(true)}});
window.addEventListener("hashchange",()=>{paintNav();scrollTo(0,0);refresh(true)});
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(_){}
paintNav();refresh(true);S.timer=setInterval(()=>{const a=document.activeElement;if(a&&["INPUT","SELECT"].includes(a.tagName))return;if(!["goals","read"].includes(route().page))refresh(false)},2500);
</script>
</body>
